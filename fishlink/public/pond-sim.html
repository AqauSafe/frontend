<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catfish Pond</title>
<style>
  #hud,#ana{display:none!important}   /* control panel removed: pond is driven only by the ESP32 */
  html,body{margin:0;height:100%;overflow:hidden;background:#0a1a24;font-family:system-ui,sans-serif}
  #c{display:block;width:100%;height:100%}
  #hud{max-height:92vh;overflow:auto;width:250px}
  #hud select,#hud button{width:100%;margin-top:6px;font-size:12px;padding:4px;border-radius:6px;border:0;background:#1f4256;color:#fff}
  #hud .row{display:flex;gap:4px}
  #hud input[type=checkbox]{width:auto}
  #ana{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
  #ana[hidden]{display:none}
  #ana .card{background:#0f2430;color:#e6f2f4;padding:14px;border-radius:12px;max-width:92vw;font-size:13px}
  #ch{width:340px;max-width:100%;height:auto;display:block;margin:8px 0}
  #hud{position:fixed;left:10px;top:10px;background:rgba(10,25,35,.62);color:#e6f2f4;padding:10px 12px;border-radius:10px;font-size:12px;backdrop-filter:blur(4px)}
  #hud label{display:flex;justify-content:space-between;margin-top:6px}
  #hud input{width:100%;margin:2px 0 0}
  #hud b{font-weight:600}
  #hud small{display:block;margin-top:8px;opacity:.7;line-height:1.3}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <b id="clock">Morning</b>
  <select id="mode">
    <option value="proto">WITH prototype (ESP32 sensors, feeder)</option>
    <option value="natural">WITHOUT prototype (nature takes its course)</option>
  </select>
  <!-- Sliders = internal state (driven by the ESP32) (active in prototype mode, read-only otherwise) -->
  <label>Turbidity <span id="vT"></span></label><input id="sT" type="range" min="0" max="100" value="12">
  <label>pH <span id="vP"></span></label><input id="sP" type="range" min="0" max="14" step="0.1" value="7.2">
  <label>Oxygen (pot) <span id="vO"></span></label><input id="sO" type="range" min="0" max="12" step="0.1" value="8">
  <label>Water level <span id="vL"></span></label><input id="sL" type="range" min="0" max="100" value="80">
  <div class="row"><button id="bFeed">Feed now</button><button id="bRestock">Restock</button></div>
  <button id="bExch">Change water (flush excreta/ammonia)</button>
  <button id="bAna">Compare mortality: with vs without system</button>
  <label><span>Beep sound</span><input id="snd" type="checkbox"></label>
  <small id="status"></small>
</div>
<div id="ana" hidden><div class="card"><b>Fish mortality, 14 days, same fish both ways</b>
  <canvas id="ch" width="340" height="190"></canvas><div id="anaTxt"></div><button id="anaX" style="margin-top:8px">Close</button></div></div>

<script>
/* =====================================================================
   FISH POND SIMULATION  (single file, no libraries)
   ===================================================================== */

/* ---------- 1. SPRITE INTEGRATION ------------------------------------
   Set enabled:true once your files exist. Each state is an array of
   frames (animation). Frame size can be anything; it is scaled to the
   fish's size automatically. Sprites should face RIGHT.

   Example:
     SPRITES.enabled = true;
     SPRITES.swim  = loadFrames(['sprites/fish_swim_0.png','sprites/fish_swim_1.png', ...]);
     SPRITES.gulp  = loadFrames(['sprites/fish_gulp_0.png', ...]);   // at surface, low oxygen
     SPRITES.die   = loadFrames(['sprites/fish_die_0.png', ...]);    // plays once, then holds last frame
     SPRITES.dead  = loadFrames(['sprites/fish_dead.png']);          // floating belly-up
     SPRITES.stranded = loadFrames(['sprites/fish_flop_0.png', ...]);// water gone: wiggling on the ground
     SPRITES.food  = loadFrames(['sprites/food.png']);
------------------------------------------------------------------------ */
const SPRITES = { enabled:false, swim:[], gulp:[], die:[], dead:[], stranded:[], eat:[] };  // stranded = flopping on dry ground
function loadFrames(urls){ return urls.map(u=>{const i=new Image(); i.src=u; return i;}); }
const SPRITE_FPS = 8;
const TURN_DUR = .6;   // seconds a fish takes to turn around   // animation speed for sprite frames

/* Optional sprites for scenery (leave empty to keep the canvas-drawn versions) */
// const BG = { sky:new Image(), cloud:new Image(), tree:new Image(), plant:new Image() };
// BG.sky.src='sprites/sky.png'; BG.cloud.src='sprites/cloud.png'; ...

/* ---------- 2. WATER STATE (0..1 normalised) -------------------------
   These four values are the ONLY inputs the simulation reads.
   They come from the Velxio ESP32.          */
const water = { turb:.12, ph:.51, o2:.67, level:.8 };   // ph 0..1 => pH 0..14, o2 0..1 => 0..12 mg/L
const target = { ...water };                              // pot values (what the ESP32 sends)
/* 'water' is the NORMALISED copy of 'env' used only for drawing; env (real units) is the truth. */
//<<MODEL  (pure simulation maths: shared by the live pond AND the mortality analysis)
/* ---------- REFERENCES (approximate, for tuning - please check against your species) ----------
   - Boyd, C.E. "Water Quality in Ponds for Aquaculture" / "Water Quality: An Introduction":
     dissolved oxygen (DO) crashes before dawn in fish ponds (respiration, no photosynthesis);
     daytime photosynthesis pushes DO and pH up; pH swings daily.
   - Fish excretion releases ammonia (TAN). Toxic un-ionised NH3 share rises steeply with pH and
     temperature (pKa ~9.25 at 25 C). Uneaten feed rots, uses oxygen and makes ammonia + turbidity.
   - Typical warm-water fish (tilapia/catfish): DO < 3 mg/L stressful, < 1-2 lethal; pH 6.5-9 safe;
     NH3 > ~0.5 mg/L harmful. Evaporation ~5-8 mm/day (the demo uses a faster rate so you can see it).
   Time scale: 300 real seconds = 24 simulated hours.                                              */
const CFG={ N_FISH:10, feedTimes:[7,12,17], manualTimes:[8,17], feedPerDose:12, eatPerFish:1.2,
            lookaheadH:2 };
const P={ evapPerDay:.12, rainPerHour:.02, rainAdd:.10,     // water level
          excrTan:.08, excrSolid:.03, nitrif:.03,           // each eaten pellet is later EXCRETED: adds ammonia (excrTan) + solids/turbidity (excrSolid); bacteria remove ammonia (nitrif)
          wasteDecay:.08, wasteUnit:.25,                    // rotting of uneaten feed
          respPerFish:.095, aerBoost:4, pumpPerHour:.03, exchPerHour:.12,
          manualOverfeed:2.2, manualCheckDays:1, responseDelayH:.5 };
const env={level:.8,temp:26,o2:8,ph:7.2,tan:.3,turb:12,waste:0,aer:false,pump:false,exch:false};

function mkTraits(r){          // every fish is slightly different => they do not all die together
  /* CATFISH (Clarias / Ictalurus type): hardy, air-breathing (can gulp air at the surface), tolerate low oxygen,
     wider pH and more ammonia than carp/tilapia. Nocturnal/crepuscular bottom feeders that find food with
     their barbels (smell/taste) - see updateFish(). 'bold' = how eager/forward a fish is. */
  return {gasTol:420*(.75+r()*.5), metab:.75+r()*.6, growT:10*Math.pow(30,r()), minS:8+r()*4, maxS:25+r()*12, resist:.5+r(), o2d:.3+r()*.9, o2hi:9.8+r()*1.3, phLo:4.2+r()*.8, phHi:9.5+r()*1.2, nh3d:.7+r()*.8, strandLv:.04+r()*.04, bold:.3+r()*.7, health:1, dead:false, cause:''};
}
const nh3Of=e=>e.tan/(1+Math.pow(10,9.25-e.ph));
function stress(e,f,stranded){   // -> [health lost per second, main cause]
  let d=0,best=0,c='';
  const add=(v,n)=>{ if(v>0){ d+=v; if(v>best){best=v;c=n;} } };
  add(e.o2<f.o2d? .012+(f.o2d-e.o2)*.08:0,'low oxygen');
  add((f.gasT||0)>f.gasTol? .03+Math.min(1,((f.gasT-f.gasTol)/60))*.03:0,'gas bubble disease (too much oxygen)');   // starts only after ~7 min of exposure
  add(e.ph<f.phLo? .012+(f.phLo-e.ph)*.06:0,'acidic pH');
  add(e.ph>f.phHi? .012+(e.ph-f.phHi)*.06:0,'alkaline pH');
  add(nh3Of(e)>f.nh3d? .012+(nh3Of(e)-f.nh3d)*.1:0,'ammonia');
  add(e.turb>92? .004:0,'turbidity');
  add(stranded? .03:0,'no water');      // air-breathing catfish last longer out of water
  return [d*f.resist,c];
}
/* Natural pond physics (used when there is NO prototype, and by the analysis) */
function stepEnv(e,dt,t,n,rand){
  const dH=dt*24/300, sun=Math.max(0,Math.sin(t*6.2832)), vol=Math.max(e.level,.12);
  e.level-=P.evapPerDay/24*(.3+sun)/.94*dH;                    // sun evaporates water
  if(rand()<P.rainPerHour*dH) e.level+=P.rainAdd;               // occasional rain
  if(e.pump) e.level+=P.pumpPerHour*dH;                         // (system only) top-up pump
  e.level=clamp(e.level,0,1);
  e.temp=25+4*Math.sin((t-.1)*6.2832)+(1-e.level)*3;            // shallow water gets hotter
  const T=e.temp, sat=14.6-.4*T+.005*T*T, bloom=clamp(e.tan/6,0,1);   // nutrients -> algae bloom
  const decay=P.wasteDecay*e.waste; e.waste=Math.max(0,e.waste-decay*dH);
  const reaer=.25*(sat-e.o2)*(e.aer?P.aerBoost:1);              // air <-> water exchange
  const photo=1.6*sun*(1+bloom)*(1-e.turb/150);                 // plants/algae make O2 in daylight
  const resp=(P.respPerFish*n*(T/25)+.8*decay)/vol+.15+.4*bloom; // fish + rotting feed use O2 (less water = worse)
  e.o2=clamp(e.o2+(reaer+photo-resp)*dH,0,16);
  const rel=(e.exc||0)*.25*dH; e.exc=(e.exc||0)-rel;            // (analysis only) eaten feed is excreted a few hours later
  e.waste+=rel*P.excrSolid; e.tan=Math.max(0,e.tan+((.4*decay+rel*P.excrTan)/vol-P.nitrif*e.tan)*dH);
  const phT=7.4+(.9+1.2*bloom)*(sun-.35)-.15*e.tan;             // day: pH up, night/excretion: pH down
  e.ph=clamp(e.ph+(phT-e.ph)*Math.min(1,.3*dH),3,11);
  const tuT=5+12*e.waste+20*bloom+8*(1-e.level);
  e.turb=clamp(e.turb+(tuT-e.turb)*Math.min(1,.25*dH),0,100);
  if(e.exch){ const f=Math.min(1,P.exchPerHour*dH); e.tan*=1-f; e.waste*=1-f; e.turb-=(e.turb-5)*f; }
}
/* ---------- SENSORS: warn = "about to go bad" (current OR predicted 2 h ahead), crit = already bad ---------- */
const SENS=[{k:'do',n:'DO',  get:e=>e.o2,       lo:[4,2.5],  hi:[10,11]},
            {k:'ph',n:'pH',  get:e=>e.ph,       lo:[6.5,5.5],hi:[8.8,9.5]},
            {k:'tu',n:'NTU', get:e=>e.turb,     lo:[-1,-1],  hi:[60,85]},
            {k:'lv',n:'LVL', get:e=>e.level*100,lo:[35,15],  hi:[999,999]}];
const grade=(s,v)=>(v<s.lo[1]||v>s.hi[1])?2:(v<s.lo[0]||v>s.hi[0])?1:0;
function makeSensorState(){ return SENS.map(()=>({prev:null,slope:0})); }
function updateSensors(st,e,dH){   // -> [0 ok | 1 warn | 2 critical] per sensor
  return SENS.map((s,i)=>{ const v=s.get(e), q=st[i];
    if(q.prev!==null&&dH>0) q.slope+=(((v-q.prev)/dH)-q.slope)*.05; q.prev=v;
    return Math.max(grade(s,v), grade(s,v+q.slope*CFG.lookaheadH)>0?1:0); });
}
const crossedHour=(a,b,list)=>list.some(x=>a<=b?(a<x&&x<=b):(x>a||x<=b));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

/* ---------- ANALYSIS: run the same fish through the pond WITH and WITHOUT the system ----------
   WITHOUT: hand feeding (overfeeds), farmer visits once per P.manualCheckDays (tops up water, partial change).
   WITH:    metered feeder + sensors; once a sensor stays red/blinking for P.responseDelayH the farmer/actuators
            react (aerator, top-up pump, water exchange). That reaction is the ASSUMPTION - edit it freely.   */
function runScenario(withSystem,seed,days){
  const r=mulberry32(seed), wx=mulberry32(seed+7919), N=CFG.N_FISH, dt=.5, fs=[];
  for(let i=0;i<N;i++) fs.push(mkTraits(r));
  const e={level:.85,temp:26,o2:7.5,ph:7.3,tan:.3,turb:12,waste:0,exc:0,aer:false,pump:false,exch:false};
  const st=makeSensorState(), tm=[0,0,0,0], curve=[0], causes={}, feedH=withSystem?CFG.feedTimes:CFG.manualTimes;
  let prevH=6, dead=0;
  for(let i=1;i<=days*300/dt;i++){
    const t=((i*dt)/300)%1, h=(t*24+6)%24, dH=dt*24/300, alive=N-dead;
    if(crossedHour(prevH,h,feedH)){ const dose=CFG.feedPerDose*(withSystem?1:P.manualOverfeed); e.exc+=Math.min(dose,alive*CFG.eatPerFish); e.waste+=(Math.max(0,dose-alive*CFG.eatPerFish)+dose*(withSystem?.03:.12))*P.wasteUnit; }   // 3 spread feeders miss far less than hand-throwing

    if(!withSystem&&crossedHour(prevH,h,[8])&&Math.floor(i*dt/300)%P.manualCheckDays===0){ e.level=Math.max(e.level,.85); e.tan*=.6; e.turb*=.7; e.waste*=.6; }
    prevH=h;
    stepEnv(e,dt,t,alive,wx);
    if(withSystem){ const g2=updateSensors(st,e,dH); for(let k=0;k<4;k++) tm[k]=g2[k]>0?tm[k]+dH:0;
      e.aer=tm[0]>=P.responseDelayH||(e.aer&&e.o2<6.5);
      e.pump=tm[3]>=P.responseDelayH||(e.pump&&e.level<.85);
      e.exch=tm[1]>=P.responseDelayH||tm[2]>=P.responseDelayH||(e.exch&&(e.turb>20||e.ph>8.4||e.ph<6.8)); }
    for(const f of fs){ if(f.dead) continue; const [d,c]=stress(e,f,e.level<f.strandLv);
      if(d>0){ f.health-=d*dt; f.cause=c; } else f.health=Math.min(1,f.health+.01*dt);
      if(f.health<=0){ f.dead=true; dead++; causes[c]=(causes[c]||0)+1; } }
    if(i%300===0) curve.push(dead/N);                 // one point per half day
  }
  return {curve,causes};
}
//>>MODEL


/* ---------- 3. INPUT FROM THE VELXIO ESP32 ----------------------------------
   The ESP32 (running in Velxio) publishes its 4 sensor readings over WiFi; the Flask backend receives them and the block at the
   bottom of this file listens to the backend and calls setPotentiometers(t,p,o,l) with each reading (0..1023).        */
function setPotentiometers(t,p,o,l){            // call with raw ADC 0..1023
  target.turb=t/1023; target.ph=p/1023; target.o2=o/1023; target.level=l/1023;
  syncSliders();
}

/* ---------- 4. SETUP ----------------------------------------------- */
const cv=document.getElementById('c'), g=cv.getContext('2d');
let W=0,H=0;
function resize(){
  const d=devicePixelRatio||1; W=innerWidth; H=innerHeight;
  cv.width=W*d; cv.height=H*d; g.setTransform(d,0,0,d,0,0); buildScene();
}
addEventListener('resize',resize);

const $=id=>document.getElementById(id);
const S={T:$('sT'),P:$('sP'),O:$('sO'),L:$('sL')};
function readSliders(){
  target.turb=S.T.value/100; target.ph=S.P.value/14; target.o2=S.O.value/12; target.level=S.L.value/100;
}
function syncSliders(){ S.T.value=target.turb*100; S.P.value=target.ph*14; S.O.value=target.o2*12; S.L.value=target.level*100; }
Object.values(S).forEach(s=>s.addEventListener('input',readSliders));

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a);
const mix=(c1,c2,t)=>c1.map((v,i)=>Math.round(lerp(v,c2[i],t)));
const rgb=(c,a=1)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;

/* geometry (recomputed in buildScene) */
let horizon,landY,bedY,poolL,poolR,plants=[],rocks=[],clouds=[],stars=[],bubbles=[],motes=[],fish=[],food=[],trees=[];
function surfaceY(){ return lerp(bedY, landY+14, env.level); }  // level 0 = pond completely dry

let lastLive=0;                                            // time of the last message from the Velxio ESP32
let SC=1, DENS=1, spawned=0, pebbles=[], snow=[], eatLoad=0;      // SC = fish/pond scale for this screen size
const gore=[], blood=[];                                   // cannibalism effects
function buildScene(){
  horizon=H*.30; landY=H*.38; bedY=H*.93; poolL=W*.05; poolR=W*.95;
  plants=[];
  for(let i=0;i<Math.floor(W/28);i++) plants.push({x:rnd(poolL+10,poolR-10),h:rnd(50,160),n:3+Math.floor(rnd(0,3)),ph:rnd(0,6.28),w:rnd(2,4),g:rnd(0,1)});
  rocks=[]; for(let i=0;i<9;i++) rocks.push({x:rnd(poolL+20,poolR-20),r:rnd(10,30),s:rnd(.5,.8)});
  clouds=[]; for(let i=0;i<6;i++) clouds.push({x:rnd(0,W),y:rnd(10,horizon*.7),s:rnd(.6,1.4),v:rnd(4,12)});
  stars=[]; for(let i=0;i<120;i++) stars.push({x:rnd(0,W),y:rnd(0,horizon),r:rnd(.4,1.4),p:rnd(0,6)});
  trees=[]; for(let i=0;i<5;i++) trees.push({x:rnd(0,1)<.5?rnd(-10,poolL+40):rnd(poolR-40,W),h:rnd(70,130)});
  pebbles=[]; for(let i=0;i<46;i++) pebbles.push({x:rnd(poolL+8,poolR-8),dy:rnd(5,30),r:rnd(1.2,3.4),t:rnd(0,1)});
  /* FISH COUNT FOLLOWS THE SCREEN: 16 on a phone (~400 px wide), more on wider screens (1 per 25 px, max 60) */
  const popParam=parseInt(new URLSearchParams(location.search).get('population')), fit=clamp(Math.round(W*30/412),30,100), want=popParam>0?Math.min(fit,popParam):fit;          // 30 fish on a ~400 px phone, ~73 at 1000 px, 100 on big screens
  SC=clamp(W/1000,.55,1.05)*(want>60?.85:1); DENS=clamp(40/want,.45,1);   // denser ponds: slightly smaller fish, less personal space
  while(spawned<want){ spawnFish(); spawned++; }                // (resizing the window only ever ADDS fish)
}

/* ---------- 5. FISH ---------------------------------------------------
   state: 'swim' | 'gulp' | 'dying' | 'dead'                            */
const PALETTE=[[74,74,66],[92,80,60],[62,68,74],[100,90,72],[80,72,80]];   // catfish: slate, olive, brown, grey
const stats={dead:0,causes:{}};
const SPACE=95;                   // personal space in pixels (raise for more room between fish)
let lightNow=1, feedAlert=0;
/* ---------- EXCRETA: fish excrete a few seconds AFTER eating (so the amount follows the feed). Each event makes a visible
   brown particle that sinks, spreads and fades into the water ("blends in") and adds ammonia (-> lower pH) and solids
   (-> turbidity) to the real water values. Eat more => excrete more => murkier, more acidic water. */
const poop=[];
function excrete(f,a=1){          // a = how much was eaten (1 = one pellet)
  const w=a*.35*(10/Math.max(10,fish.length));        // the pond is bigger on a bigger screen, so the load per event is shared
  poop.push({x:f.x-f.dir*f.size*1.4,y:f.y+f.size*.2,vx:-f.dir*rnd(4,10),vy:rnd(2,6),age:0,life:rnd(12,18),sz:clamp(.6+.45*a,.6,1.6)});
  env.waste+=P.excrSolid*w; env.tan+=P.excrTan*w/Math.max(env.level,.12);
}
/* Starvation does NOT automatically mean cannibalism. While some fish have been starving (and no feed is in the water) the pond rolls the dice
   once every 45 s: 30 % chance an attack happens. If it does, ONE smaller fish is picked and ALL the starving fish charge at it together. */
const HUNT={victim:null,hunters:[],cd:20,t:0,chance:.30};
function endHunt(){ if(HUNT.victim) HUNT.victim.hunted=false; for(const o of HUNT.hunters) o.prey=null; HUNT.victim=null; HUNT.hunters=[]; HUNT.cd=45; }
function updateCannibalism(dt){
  HUNT.cd=Math.max(0,HUNT.cd-dt);
  if(HUNT.victim){ HUNT.t+=dt; const v=HUNT.victim; if((v.state!=='swim'&&v.state!=='eat'&&v.state!=='gulp')||HUNT.t>18||!HUNT.hunters.some(o=>o.prey===v)) endHunt(); return; }
  if(HUNT.cd>0) return;
  const hungry=fish.filter(f=>(f.state==='swim'||f.state==='eat')&&f.starveT>22);
  if(!hungry.length||food.some(p=>!p.dead)) return;
  HUNT.cd=45;                                          // one roll per 45 s
  if(Math.random()>HUNT.chance) return;                // 30 % chance it actually happens
  const big=Math.max(...hungry.map(f=>f.size)), cands=fish.filter(o=>(o.state==='swim'||o.state==='eat')&&o.size<big*.72);
  if(!cands.length) return;
  const v=cands[Math.floor(Math.random()*cands.length)], pack=hungry.filter(f=>f.size>v.size*1.1);
  if(!pack.length) return;
  HUNT.victim=v; HUNT.hunters=pack; HUNT.t=0; v.hunted=true; for(const f of pack){ f.prey=v; f.huntT=0; }
}
function eatFish(h,p){            // the hunter bites: the victim is sliced in half and eaten
  p.state='gone'; p.hunted=false;                       // the whole pack tears it apart: the others near it get a share too
  for(const o of HUNT.hunters){ if(o.prey===p){ o.prey=null; o.huntCd=60; if(o!==h&&Math.hypot(o.x-p.x,o.y-p.y)<o.size*4) o.stomach=Math.min(1.2,o.stomach+.2); } }
  HUNT.victim=null; HUNT.hunters=[]; HUNT.cd=60;
  stats.dead++; stats.causes.cannibalism=(stats.causes.cannibalism||0)+1; stats.eaten=(stats.eaten||0)+1;
  const set=SPRITES.v[p.vr%SPRITES.v.length];
  if(set){ const im=set.swim[Math.floor(p.phase*1.3)%set.swim.length], k=(p.size*3.6)/ATLAS.ref;
    for(const front of [true,false]) gore.push({im,k,front,x:p.x,y:p.y,dir:p.dir,vx:(front?1:-1)*p.dir*rnd(12,28),vy:rnd(-14,-4),rot:0,vr:(front?1:-1)*rnd(.3,.9),age:0,life:7}); }
  for(let i=0;i<30;i++) blood.push({x:p.x+rnd(-p.size,p.size),y:p.y+rnd(-p.size*.4,p.size*.4),vx:rnd(-45,45),vy:rnd(-35,35),r:rnd(2,6),age:0,life:rnd(2.5,5.5)});
  h.stomach=Math.min(1.2,h.stomach+.25+.6*(p.size/h.size)); h.eatT=.6; h.g=Math.min(1,h.g+.012);
  h.gutQ.push({h:rnd(6,14)/h.metab,a:1.8}); env.waste+=.05; env.tan+=.08/Math.max(env.level,.12);          // blood + flesh pollute the water
}
function updateGore(dt){
  for(const h of gore){ h.age+=dt; h.x+=h.vx*dt; h.vx*=1-dt*.8; h.vy+=dt*22; h.y=Math.min(h.y+h.vy*dt,bedY-6); if(h.y<bedY-6) h.rot+=h.vr*dt; }
  for(const b of blood){ b.age+=dt; b.x+=b.vx*dt; b.y+=b.vy*dt; b.vx*=1-dt*1.5; b.vy=lerp(b.vy,4,dt); }
  for(let i=gore.length-1;i>=0;i--) if(gore[i].age>gore[i].life) gore.splice(i,1);
  for(let i=blood.length-1;i>=0;i--) if(blood[i].age>blood[i].life) blood.splice(i,1);
}
function drawGore(){
  for(const b of blood){ const k=b.age/b.life; g.fillStyle=`rgba(150,12,16,${.4*(1-k)})`; g.beginPath(); g.arc(b.x,b.y,b.r*(1+k*3.5),0,6.283); g.fill(); }
  for(const h of gore){ const w=h.im.width*h.k, hh=h.im.height*h.k;
    g.save(); g.globalAlpha=clamp((h.life-h.age)/2,0,1); g.translate(h.x,h.y); g.rotate(h.rot); g.scale(h.dir,1);
    g.beginPath(); if(h.front) g.rect(0,-hh,w/2+2,hh*2); else g.rect(-w/2-2,-hh,w/2+2,hh*2); g.clip();      // keep only the head half / the tail half
    g.drawImage(h.im,-w/2,-hh/2,w,hh);
    g.fillStyle='rgba(175,15,20,.92)'; g.beginPath(); g.ellipse(0,0,hh*.09,hh*.42,0,0,6.283); g.fill();        // raw cut surface
    g.restore(); }
}
function updatePoop(dt,sY){
  for(const p of poop){ p.age+=dt; p.vx*=1-dt; p.vy=lerp(p.vy,7,dt); p.x+=p.vx*dt; p.y=clamp(p.y+p.vy*dt,sY,bedY-1); }
  for(let i=poop.length-1;i>=0;i--) if(poop[i].age>poop[i].life) poop.splice(i,1);
}
function drawPoop(){   /* SPRITE HOOK: swap for an excreta sprite if you like */
  for(const p of poop){ const k=p.age/p.life, a=1-k, r=(2+k*9)*(p.sz||1);
    g.fillStyle=`rgba(115,92,52,${.14*a})`; g.beginPath(); g.arc(p.x,p.y,r*2.3,0,6.283); g.fill();     // haze spreading into the water
    g.fillStyle=`rgba(105,80,45,${.8*a*a})`; g.beginPath(); g.ellipse(p.x,p.y,r,r*.6,0,0,6.283); g.fill(); }
}      // feedAlert = seconds the fish stay 'excited' after a feeding (or just before one)
function spawnFish(){
  const sY=surfaceY(), g0=Math.random()<.35?rnd(.65,1):rnd(0,.5), sz=(9+19*g0)*SC; let x,y;
  for(let i=0;i<20;i++){ x=rnd(poolL+40,poolR-40); y=rnd(Math.max(sY+30,bedY-90),Math.max(sY+31,bedY-20));   // catfish live near the bottom
    if(fish.every(o=>Math.hypot(o.x-x,o.y-y)>110)) break; }
  const f=Object.assign(mkTraits(Math.random),{vr:Math.floor(rnd(0,8)),g:g0,fedAvg:0,starveT:0,x,y,vx:rnd(-1,1),vy:0,size:sz,col:PALETTE[Math.floor(rnd(0,PALETTE.length))],
    dir:1,tx:0,ty:0,hx:x,wt:0,phase:rnd(0,6),state:'swim',mode:'scout',stateT:0,fade:1,speed:rnd(26,46),stomach:rnd(.45,.9),
    sniffT:0,eatT:0,gutQ:[],fd:Math.floor(rnd(0,FEEDER.xs.length))});      // fd = the feeder this fish waits under
  f.fedAvg=f.stomach; f.size=(f.minS+(f.maxS-f.minS)*f.g)*SC; fish.push(f); newTarget(f);
}
function newTarget(f){            // scouting spot: mostly along the bottom, sometimes mid-water at night; furthest from other fish
  const sY=surfaceY(), night=1-lightNow; let best=[f.x,f.y],bs=-1;
  for(let i=0;i<8;i++){ const x=rnd(poolL+30,poolR-30), y=Math.random()<.25*night?rnd(sY+30,Math.max(sY+31,bedY-30)):bedY-rnd(14,60); let m=1e9;
    for(const o of fish) if(o!==f&&o.state!=='dead') m=Math.min(m,Math.hypot(o.tx-x,o.ty-y),Math.hypot(o.x-x,o.y-y));
    if(m>bs){bs=m;best=[x,Math.max(y,sY+20)];} }
  f.tx=best[0]; f.ty=best[1]; f.wt=rnd(2,5);
  const cover=rocks.length?rocks[Math.floor(rnd(0,rocks.length))]:{x:f.x}; f.hx=cover.x+rnd(-25,25);   // daytime hiding spot (rock/cover)
}
function updateFish(f,dt,sY){
  if(f.state==='gone') return;
  const stranded=(bedY-sY)<f.size*.5+8, lowO2=env.o2<3.5, hyper=env.o2>f.o2hi-1;
  f.stateT+=dt; f.phase+=dt*(4+Math.hypot(f.vx,f.vy)*.08);
  if(f.state!=='dying'&&f.state!=='dead'){
    const [d,c]=stress(env,f,stranded);              // each fish has its own tolerances => different death times
    if(d>0){ f.health-=d*dt; f.cause=c; } else f.health=Math.min(1,f.health+.01*dt);
    /* HUNGER + GROWTH. A full stomach empties over roughly half a simulated day; warm water and busy swimming speed it up, and each fish differs (metab).
       Well-fed fish GROW (size follows f.g); underfed ones stop growing and eventually turn on smaller fish. */
    const act=1+Math.min(1,Math.hypot(f.vx,f.vy)/80)*.5;
    f.stomach=Math.max(0,f.stomach-.0035*f.metab*(env.temp/25)*act*dt);
    f.fedAvg+=(f.stomach-f.fedAvg)*dt/60;
    f.g=clamp(f.g+dt/f.growT*clamp((f.fedAvg-.15)/.35,-.3,1)*f.health,0,1); f.size=(f.minS+(f.maxS-f.minS)*f.g)*SC;   // each fish grows at its own pace toward its own adult size
    f.starveT=f.stomach<.12?f.starveT+dt:0;
    /* TOO MUCH OXYGEN (gas bubble disease): gas bubbles form on the gills, fins and mouth straight away and the fish struggles to breathe.
       Real damage only starts after about 7 minutes of exposure (each fish a bit earlier or later: gasTol). */
    const gasOver=env.o2>f.o2hi;
    f.gasT=gasOver?(f.gasT||0)+dt:Math.max(0,(f.gasT||0)-dt*.6);
    f.bub=lerp(f.bub||0,gasOver?1:0,dt*(gasOver?.5:.08));              // how covered in bubbles the fish is (0..1)
    if(f.bub>.4&&Math.random()<dt*1.5) bubbles.push({x:f.x+f.dir*f.size*1.2,y:f.y,r:rnd(1,2.4),ph:rnd(0,6)});   // bubbles streaming off it
    /* DIGESTION: what was eaten is excreted hours LATER (3-12 simulated hours, different for every fish; faster when warm / active) */
    for(let i=f.gutQ.length-1;i>=0;i--){ const q=f.gutQ[i]; q.h-=dt*24/300*f.metab*(env.temp/25)*act; if(q.h<=0){ f.gutQ.splice(i,1); excrete(f,q.a); } }
    if(f.health<=0){ f.state=stranded?'dead':'dying'; f.stateT=0; stats.dead++; stats.causes[f.cause]=(stats.causes[f.cause]||0)+1; }
  }
  if(f.state==='dying'){                  // spin, then float up belly-up
    f.vx*=.97; f.vy=-18*Math.min(f.stateT/2,1); if(f.stateT>2.5){ f.state='dead'; f.stateT=0; }
  } else if(f.state==='dead'){            // dead fish STAY (floating, or lying on the ground if the pond is dry)
    f.vx*=.95; f.vy=(Math.min(sY+6,bedY-f.size*.3)-f.y)*.6;
    f.deadT=(f.deadT||0)+dt; const kg=f.size/SC/18;                    // a dead fish rots: pollutes the water until the farmer removes it
    env.waste+=.004*dt*kg; env.tan+=.003*dt*kg/Math.max(env.level,.12); if(f.deadT>140) f.state='gone';
  } else if(stranded){                    // no water: flop about on the ground until it dies
    f.state='stranded'; f.vx=Math.sin(f.phase*2)*25; f.vy=(bedY-f.size*.3-f.y)*4;
  } else {
    /* ---- CATFISH BEHAVIOUR ----------------------------------------------------------------
       rush       : smells food (barbels = taste buds) from far away and rushes it; bold fish rush faster
       anticipate : after a feeding, or just before a scheduled one, fish gather under their feeder (they learn the routine)
       air        : very low oxygen -> swim up and gulp air (catfish can)
       rest       : daytime -> hide near rocks/cover, barely move (catfish are nocturnal)
       scout      : night/dusk -> patrol the bottom, stop to sniff with barbels, move on                      */
    f.wt-=dt; f.sniffT=Math.max(0,f.sniffT-dt); f.eatT=Math.max(0,f.eatT-dt);
    const night=1-lightNow; let tx=f.tx, ty=f.ty, sp=f.speed*(.5+water.o2*.5), best=null, bd=1e9;
    if(f.stomach<.85) for(const p of food){ if(p.dead||p.y<sY)continue; const dd=Math.hypot(p.x-f.x,p.y-f.y); if(dd<bd&&dd<250+f.bold*350){bd=dd;best=p;} }
    /* ---- CANNIBALISM is decided for the whole pond by updateCannibalism(); here a fish only follows its assigned prey ---- */
    f.huntCd=Math.max(0,(f.huntCd||0)-dt);
    if(f.prey&&((f.prey.state!=='swim'&&f.prey.state!=='eat'&&f.prey.state!=='gulp')||f.huntT>16||f.stomach>.5)) f.prey=null;
    /* Air-breathing catfish: when oxygen is low they do NOT sit at the surface; they dart up, gulp air, and dive back.
       The lower the oxygen, the more often they go (below ~1.5 mg/L they are up almost constantly). */
    f.gulpT=Math.max(0,(f.gulpT||0)-dt); if(f.airNext===undefined) f.airNext=rnd(1,5); f.airNext-=dt;
    if(!lowO2){ f.airUp=false; f.didGulp=false; }
    else if(f.airNext<=0) f.airUp=true;
    if(f.airUp){ if(f.y<sY+16&&!f.didGulp){ f.gulpT=.7; f.didGulp=true; bubbles.push({x:f.x+f.dir*f.size,y:f.y,r:rnd(1.5,3),ph:rnd(0,6)}); }
                 else if(f.didGulp&&f.gulpT<=0){ f.airUp=false; f.didGulp=false; f.airNext=rnd(5,12)*clamp(env.o2/3.5,.08,1); } }
    if(f.hunted&&HUNT.hunters.length){ f.mode='flee'; const nh=HUNT.hunters.reduce((m,o)=>(!m||Math.hypot(o.x-f.x,o.y-f.y)<Math.hypot(m.x-f.x,m.y-f.y))?o:m,null); const hx=f.x-nh.x, hy=f.y-nh.y, hd=Math.hypot(hx,hy)||1; tx=f.x+hx/hd*220; ty=clamp(f.y+hy/hd*120,sY+20,bedY-14); sp*=2.8; }
    else if(f.airUp){ f.mode='air'; ty=sY+6; sp*=f.didGulp?0:2.1; }
    else if(f.prey&&!best){ f.mode='hunt'; f.huntT+=dt; tx=f.prey.x+f.prey.vx*.3; ty=f.prey.y+f.prey.vy*.3; sp*=3.6;                // violent charge
      if(Math.random()<dt*14) bubbles.push({x:f.x-f.dir*f.size,y:f.y,r:rnd(1,2.2),ph:rnd(0,6)}); }
    else if(best){ f.mode='rush'; tx=best.x; ty=best.y; sp*=1.9+f.bold*.8; }
    else if(feedAlert>0&&f.stomach<.85){ f.mode='anticipate'; tx=W*FEEDER.xs[f.fd]+Math.sin(f.phase*.4+f.fd)*45; ty=sY+25+f.bold*35; sp*=1.4; }
    else if(lightNow>.55&&f.stomach>.3){ f.mode='rest'; tx=f.hx; ty=bedY-10; sp*=.35; if(Math.hypot(tx-f.x,ty-f.y)<14) sp=0; }
    else { f.mode='scout'; sp*=.7+night*.8;
      if(f.sniffT>0) sp=0;                                           // pause: barbels sweeping the bottom
      else if(Math.hypot(f.tx-f.x,f.ty-f.y)<22||f.wt<=0){ f.sniffT=rnd(1,2.5); newTarget(f); } }
    if(f.bub>.3&&!f.airUp&&f.gulpT<=0&&Math.random()<dt*.45*f.bub) f.gulpT=.7;    // gasping: bubbles in the gills block breathing
    f.state=f.gulpT>0?'gulp':f.eatT>0?'eat':'swim';
    /* stressed / over-oxygenated fish: restless, jerky darting (and, with too much O2, buoyant gas-bubble trouble near the surface) */
    if(hyper&&!best&&!f.airUp) ty=lerp(ty,sY+30,.5);
    const agit=clamp((1-f.health)*1.4,0,1)+(hyper?.5:0);
    if(agit>.05&&Math.random()<dt*agit*2.5){ const a=rnd(0,6.283); f.vx+=Math.cos(a)*f.speed*agit*2.2; f.vy+=Math.sin(a)*f.speed*agit*1.5; }
    const ax=tx-f.x, ay=ty-f.y, dd0=Math.hypot(ax,ay)||1;
    sp*=1-.35*(f.bub||0);                                           // suffocating fish are sluggish
    const acc=(f.mode==='hunt'||f.mode==='flee')?6:2, vyk=f.mode==='hunt'?1:.6;
    f.vx=lerp(f.vx,ax/dd0*sp,dt*acc); f.vy=lerp(f.vy,ay/dd0*sp*vyk,dt*acc);
    const space=((f.mode==='rush'||f.mode==='anticipate')?45:f.mode==='rest'?SPACE*.6:SPACE)*SC*.8*DENS;     // crowd in when eager
    for(const o of fish){ if(o===f||o.state==='dead'||o.state==='gone'||o===f.prey)continue; const dx=f.x-o.x,dy=f.y-o.y,dd=Math.hypot(dx,dy);
      if(dd<space&&dd>.1){ const k=(space-dd)/space; f.vx+=dx/dd*k*140*dt; f.vy+=dy/dd*k*140*dt; } }
    if(best&&bd<8+f.size*.5){ best.dead=true; f.stomach=Math.min(1.2,f.stomach+.22*16/(f.size/SC)); f.eatT=.35; feedStats.eatenG+=PELLET_G; eatLoad=Math.min(1,eatLoad+.03);
      f.gutQ.push({h:rnd(3,12)/f.metab,a:1}); }   // excreted hours later, different for every fish
    if(f.prey&&f.mode==='hunt'&&Math.hypot(f.prey.x-f.x,f.prey.y-f.y)<f.size*1.3+f.prey.size*.5) eatFish(f,f.prey);
  }
  f.x+=f.vx*dt; f.y+=f.vy*dt;
  const lo=sY+(f.state==='dead'?2:8); f.x=clamp(f.x,poolL+15,poolR-15); f.y=clamp(f.y,lo,Math.max(lo,bedY-(f.state==='stranded'||f.state==='dead'?f.size*.3:12)));
  if(f.turnT>0){ f.turnT+=dt; if(f.turnT>TURN_DUR) f.turnT=0; }
  if(Math.abs(f.vx)>3){ const nd=f.vx>0?1:-1;
    if(nd!==f.dir){ if(!(f.turnT>0)&&(f.state==='swim'||f.state==='eat')&&Math.abs(f.vx)>8){        // start a turn: show the fish head-on or tail-on while it swings round
        f.turnT=.001; f.turnFrom=f.dir; f.turnFlip=Math.random()<.5?1:-1; f.turnView=Math.random()<.55?'front':'back'; }
      f.dir=nd; } }
}

SPRITES.v=[]; SPRITES.ready=false;
(function(){
  function tint(img,x,y,w,h,d,spots){
    const c=document.createElement('canvas'); c.width=w; c.height=h; const x2=c.getContext('2d',{willReadFrequently:true});
    x2.drawImage(img,x,y,w,h,0,0,w,h);
    const id=x2.getImageData(0,0,w,h), px=id.data;
    for(let i=0;i<px.length;i+=4){ if(!px[i+3]) continue;
      const R=px[i],G=px[i+1],B=px[i+2], lum=.3*R+.59*G+.11*B, tail=(R>G*1.55&&R>130);
      const f=(tail||lum>150)?lerp(d,1,.5):d, sat=.35+.65*d;               // darker fish are also less colourful
      px[i]=lerp(lum,R,sat)*f; px[i+1]=lerp(lum,G,sat)*f; px[i+2]=lerp(lum,B,sat)*f; }
    x2.putImageData(id,0,0);
    x2.globalCompositeOperation='source-atop';                              // spots only land on the fish, never outside it
    x2.fillStyle=d<.5?'rgba(120,112,104,.40)':'rgba(18,10,5,.50)';
    for(const sp of spots){ x2.beginPath(); x2.ellipse(sp.u*w,sp.w*h+h*.12,sp.rad*w*1.2,sp.rad*w,0,0,6.283); x2.fill(); }
    return c;
  }
  const load=src=>new Promise(r=>{ const i=new Image(); i.onload=()=>r(i); i.src=src; });
  Promise.all([load(ATLAS.src),load(ATLAS_EXTRA.front),load(ATLAS_EXTRA.back)]).then(([img,fr,bk])=>{
    const NV=8;
    for(let v=0;v<NV;v++){
      const d=.26+.74*(v/(NV-1)), r=mulberry32(v*977+13), spots=[], nsp=6+Math.floor(r()*12);
      for(let i=0;i<nsp;i++) spots.push({u:.14+r()*.66, w:.2+r()*.36, rad:.012+r()*.03});
      const set={};
      for(const k in ATLAS.frames) set[k]=ATLAS.frames[k].map(([x,y,w,h])=>tint(img,x,y,w,h,d,spots));
      set.front=[tint(fr,0,0,fr.width,fr.height,d,spots)]; set.back=[tint(bk,0,0,bk.width,bk.height,d,spots)];
      SPRITES.v.push(set);
    }
    SPRITES.ready=true; SPRITES.enabled=true;
  });
})();

function drawFish(f,light){
  if(!SPRITES.ready||f.state==='gone') return;
  const s=f.size, spd=Math.hypot(f.vx,f.vy);
  const depth=clamp((f.y-surfaceY())/(bedY-surfaceY()),0,1);
  const alpha=f.fade*(1-water.turb*(.25+depth*.6));      // murky water hides fish deeper down
  const set=SPRITES.v[f.vr%SPRITES.v.length];
  let frames,idx;
  const loop=rate=>Math.floor(f.phase*rate)%frames.length;
  switch(f.state){
    case 'stranded': frames=set.flop; idx=loop(1.1); break;                                                  // flopping on dry ground
    case 'dying':    frames=set.die;  idx=Math.min(frames.length-1,Math.floor(f.stateT/2.5*frames.length)); break;
    case 'dead':     frames=set.dead; idx=Math.floor(f.phase*.12)%frames.length; break;                      // belly-up, gently drifting
    case 'gulp':     frames=set.gulp; idx=Math.min(frames.length-1,Math.floor((1-f.gulpT/.7)*frames.length)); break;   // gasping at the surface
    case 'eat':      frames=set.eat;  idx=Math.min(frames.length-1,Math.floor((1-f.eatT/.35)*frames.length)); break;   // mouth opens to suck in food
    default:         if(spd<10){ frames=set.idle; idx=loop(.8); } else { frames=set.swim; idx=loop(1.3); }  // idle = barbels twitching
  }
  const img=frames[Math.max(0,Math.min(frames.length-1,idx))]; if(!img) return;
  /* TURNING: side view squeezes (body rotating away) -> HEAD-ON or TAIL-ON view -> side view opens the other way.  This is what stops it looking flat. */
  let flip=f.dir, sq=1, im2=img, wpx=(s*3.6)/ATLAS.ref*img.width;
  if(f.turnT>0&&(f.state==='swim'||f.state==='eat')){
    const u=f.turnT/TURN_DUR, V=set[f.turnView][0];
    if(u<.22){ flip=f.turnFrom; sq=1-(u/.22)*.7; }
    else if(u<.78){ im2=V; wpx=s*(f.turnView==='front'?2.1:1.9); sq=1; flip=f.turnFlip; }
    else { flip=f.dir; sq=.3+((u-.78)/.22)*.7; }
  }
  const w=wpx, h=wpx*im2.height/im2.width;
  g.save(); g.globalAlpha=clamp(alpha,0,1); g.translate(f.x,f.y);
  g.scale((flip<0?-1:1)*sq,1);
  if(f.mode==='hunt'&&(f.state==='swim'||f.state==='eat')) g.rotate(Math.sin(f.phase*9)*.12);   // thrashing charge                         // side sprites face RIGHT; flipped when swimming left
  if(im2===img&&(f.state==='swim'||f.state==='eat')) g.rotate(clamp(f.vy*.012,-.35,.35)*flip+(f.sniffT>0?.2:0));   // nose down while sniffing the bottom
  if((f.bub||0)>.5&&im2===img) g.rotate(Math.sin(f.phase*.7)*.2*f.bub);          // losing balance
  g.drawImage(im2,-w/2,-h/2,w,h);
  if((f.bub||0)>.02&&im2===img){                                                    // gas bubbles stuck to the fish
    if(!f.bubPts){ const Z=[[.47,.03,.03,.04,5],[.31,.03,.05,.10,8],[.20,.25,.07,.05,5],[.02,-.30,.10,.04,5],[-.46,0,.03,.12,5],[0,.05,.30,.14,6]]; f.bubPts=[];
      for(let r=0;r<8;r++) for(const z of Z) if(r<z[4]) f.bubPts.push({x:z[0]+rnd(-z[2],z[2]),y:z[1]+rnd(-z[3],z[3]),r:rnd(.9,2.3)}); }
    const nb=Math.round(f.bub*f.bubPts.length), kb=clamp(s/14,.7,1.7)*(.6+.4*f.bub);
    for(let i=0;i<nb;i++){ const q=f.bubPts[i], bx=q.x*w+Math.sin(f.phase*2+i)*.5, by=q.y*h+Math.cos(f.phase*1.7+i*1.3)*.5, br=q.r*kb;
      g.fillStyle='rgba(215,240,255,.5)'; g.strokeStyle='rgba(255,255,255,.85)'; g.lineWidth=.7; g.beginPath(); g.arc(bx,by,br,0,6.283); g.fill(); g.stroke();
      g.fillStyle='rgba(255,255,255,.95)'; g.beginPath(); g.arc(bx-br*.3,by-br*.3,br*.3,0,6.283); g.fill(); }
  }
  g.restore();
}

/* ---------- 6. SKY, TIME OF DAY (5 min cycle) ---------------------- */
const DAY_MS=5*60*1000;      // full morning -> night -> morning in 5 minutes
let t0=performance.now(), overcast=0;
function timeOfDay(now){ return ((now-t0)/DAY_MS+0.0)%1; }   // 0 = sunrise, .25 noon, .5 sunset, .75 midnight
function lightLevel(t){ return clamp(Math.sin(t*6.283)*1.4+.1,0,1); }   // 0 night .. 1 day
const NIGHT_TOP=[8,12,36], DAY_TOP=[70,150,225], NIGHT_BOT=[20,28,60], DAY_BOT=[190,225,245], DUSK=[255,140,80];

function drawSky(t,light,now){
  const dusk=clamp(1-Math.abs(light-.25)*4,0,1)*(Math.abs(Math.sin(t*6.283))<.45?1:0);
  const top=mix(NIGHT_TOP,DAY_TOP,light), bot=mix(mix(NIGHT_BOT,DAY_BOT,light),DUSK,dusk*.7);
  const gr=g.createLinearGradient(0,0,0,horizon); gr.addColorStop(0,rgb(top)); gr.addColorStop(1,rgb(bot));
  g.fillStyle=gr; g.fillRect(0,0,W,horizon+2);
  // stars
  const sa=clamp(1-light*2.2,0,1);
  if(sa>0) for(const s of stars){ g.fillStyle=`rgba(255,255,255,${sa*(.5+.5*Math.sin(now/600+s.p))})`; g.fillRect(s.x,s.y,s.r,s.r); }
  // sun & moon move on an arc
  const a=t*6.283, sx=W*.5-Math.cos(a)*W*.42, sy=horizon-Math.sin(a)*horizon*.85;
  const mx=W*.5+Math.cos(a)*W*.42, my=horizon+Math.sin(a)*horizon*.85;
  /* SPRITE HOOK: draw BG sun / moon images here instead if you prefer */
  g.save(); g.beginPath(); g.rect(0,0,W,horizon+2); g.clip();
  const sg=g.createRadialGradient(sx,sy,4,sx,sy,60); sg.addColorStop(0,'rgba(255,240,180,1)'); sg.addColorStop(.3,'rgba(255,200,100,.5)'); sg.addColorStop(1,'rgba(255,200,100,0)');
  g.fillStyle=sg; g.beginPath(); g.arc(sx,sy,60,0,6.283); g.fill();
  g.fillStyle='#fff4c8'; g.beginPath(); g.arc(sx,sy,16,0,6.283); g.fill();
  g.fillStyle='#e8eefc'; g.beginPath(); g.arc(mx,my,13,0,6.283); g.fill();

/* ---------- 7. WATER ----------------------------------------------- */
function waterColor(light){
  // pH: acidic -> yellow/brown, neutral -> blue-green, alkaline -> milky teal
  const ph=water.ph*14;
  let base=mix([20,70,110],[60,170,190],light);
  if(ph<6.5) base=mix(base,[150,140,50],clamp((6.5-ph)/5,0,1)*.6);
  if(ph>8) base=mix(base,[120,200,190],clamp((ph-8)/6,0,1)*.5);
  return mix(base,[110,100,60],water.turb*.7);   // turbidity -> muddy brown-green
}

      g.fillStyle=lg; g.beginPath(); g.moveTo(x-w1,sY); g.lineTo(x+w1,sY); g.lineTo(x+w1+90,bedY); g.lineTo(x+30,bedY); g.fill(); }

  g.fillStyle=sg; g.beginPath(); g.moveTo(x0,H); for(let x=x0;x<=poolR;x+=20) g.lineTo(x,bedY+Math.sin(x*.03)*6); g.lineTo(poolR,H); g.fill();
  g.strokeStyle=rgb(mix(sandTop,[255,255,235],.3),.55); g.lineWidth=1.5; g.beginPath(); for(let x=x0;x<=poolR;x+=20){ const y=bedY+Math.sin(x*.03)*6; x===x0?g.moveTo(x,y):g.lineTo(x,y); } g.stroke();
  for(const q of pebbles){ const y=bedY+Math.sin(q.x*.03)*6+q.dy; if(y>H) continue; g.fillStyle=rgb(mix(sandTop,q.t>.5?[255,250,230]:[20,16,10],.28),.8); g.beginPath(); g.ellipse(q.x,y,q.r*1.4,q.r,0,0,6.283); g.fill(); }
  for(const r of rocks){ const rc=mix([40,45,50],[128,134,140],light*.5+.2); g.fillStyle=rgb(rc); g.beginPath(); g.ellipse(r.x,bedY+4,r.r,r.r*r.s,0,Math.PI,6.283); g.fill();
    g.fillStyle=rgb(mix(rc,[255,255,255],.22),.55); g.beginPath(); g.ellipse(r.x-r.r*.25,bedY+4-r.r*r.s*.35,r.r*.45,r.r*r.s*.28,-.3,Math.PI,6.283); g.fill(); }
  // caustic ripples on the bed
  if(light>.15){ g.save(); g.globalCompositeOperation='lighter'; g.lineWidth=1.3; g.strokeStyle=`rgba(255,255,230,${.075*light*(1-water.turb*.7)})`;
    for(let r=0;r<4;r++){ g.beginPath(); for(let x=x0;x<=poolR;x+=10){ const y=bedY-4+r*7+Math.sin(x*.05+now/700+r)*3+Math.sin(x*.021-now/1100+r*2)*3; x===x0?g.moveTo(x,y):g.lineTo(x,y); } g.stroke(); } g.restore(); }

  g.fillStyle=`rgba(235,248,255,${.22*(1-water.turb*.8)})`; for(const q of snow){ q.y+=q.v*.016; q.x+=Math.sin(now/1700+q.ph)*.12; if(q.y>bedY-2) q.y=sY+4; if(q.y>sY) g.fillRect(q.x,q.y,q.r,q.r); }

function drawPlants(light,now){

    g.strokeStyle=rgb(mix(gc,[30,60,30],p.g*.5)); g.lineWidth=p.w; g.lineCap='round';

function drawSurface(light,now,sY,col){

  const rg=g.createLinearGradient(0,sY,0,sY+28); rg.addColorStop(0,`rgba(${mix([40,60,100],[225,242,255],light).join(',')},${.3+.12*light})`); rg.addColorStop(1,'rgba(255,255,255,0)');

}
function drawTurbidity(sY,col,now){

  const fg=g.createLinearGradient(0,sY,0,bedY); fg.addColorStop(0,rgb([120,105,60],a*.15)); fg.addColorStop(1,rgb([90,80,45],a*.7));
  g.fillStyle=fg; g.fillRect(poolL,sY,poolR-poolL,H-sY);
  const n=Math.floor(a*60); while(motes.length<n) motes.push({x:rnd(poolL,poolR),y:rnd(sY,bedY),v:rnd(2,8),r:rnd(.8,2)});
  while(motes.length>n) motes.pop();

/* ---------- 8. BUBBLES & FOOD ------------------------------------- */
function updateBubbles(dt,sY){
  if(Math.random()<(water.o2+(env.aer?1:0))*dt*14) bubbles.push({x:rnd(poolL+20,poolR-20),y:bedY,r:rnd(1.5,4),ph:rnd(0,6)});
  for(const b of bubbles){ b.y-=(30+b.r*8)*dt; b.x+=Math.sin(b.y*.05+b.ph)*.3; }
  bubbles=bubbles.filter(b=>b.y>sY);
}
function drawBubbles(){ g.strokeStyle='rgba(255,255,255,.55)'; g.lineWidth=1; for(const b of bubbles){ g.beginPath(); g.arc(b.x,b.y,b.r,0,6.283); g.stroke(); } }
/* ---------- 8b. FEED SYSTEM ----------------------------------------
   THREE auto-feeders hang over the KEY FEEDING AREAS (FEEDER.xs = fraction of pond width) so every fish has
   one nearby and little feed is missed. Each feeding = every feeder dispenses once (perFeeder portion).
   In the real world you cannot count pellets, so the dashboard counts FEEDINGS (feedStats.times) and grams.
   Pellets are only the visual stand-in: 1 simulated pellet = PELLET_G grams.
   Feed that sinks past vanishFrac of the water depth un-eaten disappears and is stored in the variable
   'wastedFeed' (grams, for reference); it also rots -> ammonia / oxygen loss / turbidity (env.waste).   */
const FEEDER={ times:CFG.feedTimes, xs:[.2,.5,.8], perFeeder:4, vanishFrac:.35 };
const PELLET_G=5;                    // grams represented by one simulated pellet
let wastedFeed=0, dispensing=0, lastH=-1;
const feedStats={times:0,dispensedG:0,eatenG:0,wastedG:0};   // times = number of feedings
function throwPellets(x0,y0,vx,n){ for(let i=0;i<n;i++) food.push({x:x0+rnd(-6,6),y:y0,vx:vx+rnd(-40,40),vy:rnd(0,30),dead:false}); feedStats.dispensedG+=n*PELLET_G; }
function dispenseFeed(){                       // called by the schedule or the 'Feed now' button
  FEEDER.xs.forEach(fx=>throwPellets(W*fx,landY-56,0,FEEDER.perFeeder));
  feedStats.times++; dispensing=1.2; feedAlert=10;          // fish hear/feel the feeder and get excited
}
function manualFeed(){ const n=Math.round(CFG.feedPerDose*P.manualOverfeed); for(let i=0;i<n;i++) throwPellets(rnd(poolL+40,poolR-40),landY-30,0,1); feedStats.times++; feedAlert=10; } // farmer overfeeds by hand
function updateFood(dt,sY){
  for(const p of food){
    if(p.y<sY){ p.vy+=500*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.y>=sY){ p.vx*=.15; p.vy=20; } }   // flying
    else { p.vx*=1-dt*2; p.x+=p.vx*dt; p.vy=lerp(p.vy,18,dt*3); p.y+=p.vy*dt; }                    // sinking
    p.x=clamp(p.x,poolL+4,poolR-4);
    if(!p.dead&&p.y>=sY&&(p.y>sY+(bedY-sY)*FEEDER.vanishFrac+10||p.y>=bedY-3)){ p.dead=true; wastedFeed+=PELLET_G; feedStats.wastedG+=PELLET_G; env.waste+=P.wasteUnit; }
  }
  food=food.filter(p=>!p.dead);
}
/* ---------- SMART FEEDER: feeds only what the fish actually need ----------
   - counts how many pellets all HUNGRY fish can still eat (bigger fish need more as they grow)
   - dispenses small batches, then WAITS while pellets are still sinking, and stops as soon as the fish are full => almost no waste
   - never feeds in bad water (low oxygen / high ammonia / low level) and eats less when ammonia is rising
   - needs power: if the solar battery is flat the feeding is MISSED (fish get hungry...) */
const FEED={active:false,t:0,left:0,age:0,log:'idle',sessions:0,missed:0,held:0};
function hungerDemand(){ let d=0; for(const f of fish){ if(f.state!=='swim'&&f.state!=='eat'&&f.state!=='gulp') continue; d+=Math.max(0,.85-f.stomach)/(.22*16/(f.size/SC)); } return d; }
function startFeedSession(){
  if(!power.on){ FEED.missed++; FEED.log='MISSED - no power'; return; }
  if(env.o2<4||env.level<.3||env.tan>3.5){ FEED.held++; FEED.log='held - poor water'; return; }
  const dem=hungerDemand(); if(dem<2){ FEED.log='skipped - fish full'; return; }
  FEED.active=true; FEED.t=0; FEED.age=0; FEED.left=Math.ceil(dem*1.1*(env.tan>1.5?.6:1)); FEED.sessions++; FEED.log='feeding'; feedAlert=10; dispensing=1.2; feedStats.times++;
}
function updateFeeder(dt){
  if(!FEED.active) return;
  if(!power.on){ FEED.active=false; FEED.log='stopped - power lost'; return; }
  FEED.age+=dt; FEED.t-=dt; if(FEED.t>0) return;
  const loose=food.filter(p=>!p.dead).length, dem=hungerDemand();
  if(FEED.left<=0||dem<1||FEED.age>120){ FEED.active=false; FEED.log='done'; return; }
  if(loose>Math.max(6,dem*.8)){ FEED.t=1.5; return; }                        // enough already in the water: wait
  const per=Math.max(1,Math.min(3,Math.ceil(dem/9)));
  FEEDER.xs.forEach(fx=>{ if(FEED.left>0){ throwPellets(W*fx,landY-56,0,per); FEED.left-=per; } });
  dispensing=.8; power.batt=Math.max(0,power.batt-.003); FEED.t=2.4;
}
/* ---------- SOLAR POWER: the panel charges a battery that runs the ESP32, sensors and feeders ---------- */
const power={batt:.75,on:true,solar:0};
function updatePower(dt,light,now){
  overcast=clamp(.45+.5*Math.sin(now/97000)+.25*Math.sin(now/31000+1),0,1);          // slowly changing cloud cover
  power.solar=Math.pow(light,1.3)*(1-.75*overcast);                                    // 0..1 panel output
  power.batt=clamp(power.batt+(power.solar*.005-.0012)*dt,0,1);                        // charging minus the constant load
  if(power.on&&power.batt<=.02) power.on=false; else if(!power.on&&power.batt>.12) power.on=true;
}
function drawSolar(light,now,by){
  const cx=W*.5, pw=clamp(W*.15,60,150), ph=clamp(pw*.62,38,90), sk=pw*.16, base=by-8;
  const steel=rgb(mix([40,45,52],[150,158,168],light*.7+.3)), P0=(u,v)=>[cx-pw/2+u*pw+v*sk, base-v*ph];
  g.strokeStyle=steel; g.lineWidth=3; g.beginPath(); g.moveTo(cx-pw*.25,by); g.lineTo(cx-pw*.25+sk*.35,base-ph*.5); g.moveTo(cx+pw*.25,by); g.lineTo(cx+pw*.25+sk*.35,base-ph*.5); g.stroke();
  if(power.solar>.05){ g.save(); g.shadowColor='rgba(255,220,90,.7)'; g.shadowBlur=14*power.solar; g.fillStyle='rgba(255,220,90,.01)'; g.fillRect(cx-pw/2,base-ph,pw+sk,ph); g.restore(); }
  g.fillStyle=steel; g.beginPath(); [[0,0],[1,0],[1,1],[0,1]].forEach(([u,v],i)=>{ const q=P0(u,v); i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]); }); g.closePath(); g.fill();   // frame
  const cell=rgb(mix([12,24,56],[40,96,178],light*(1-.5*overcast)));
  for(let r=0;r<3;r++) for(let c=0;c<6;c++){ const u0=c/6+.012, u1=(c+1)/6-.012, v0=r/3+.03, v1=(r+1)/3-.03;
    g.fillStyle=cell; g.beginPath(); [[u0,v0],[u1,v0],[u1,v1],[u0,v1]].forEach(([u,v],i)=>{ const q=P0(u,v); i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]); }); g.fill(); }
  const gl=g.createLinearGradient(cx-pw/2,base-ph,cx+pw/2+sk,base); gl.addColorStop(0,'rgba(255,255,255,0)'); gl.addColorStop(.5,`rgba(255,255,255,${.22*light})`); gl.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gl; g.beginPath(); [[0,0],[1,0],[1,1],[0,1]].forEach(([u,v],i)=>{ const q=P0(u,v); i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]); }); g.fill();
  // charge controller + battery box next to the panel
  const bx=cx+pw/2+sk+6, bw=18, bh=20, by2=by-bh-1;
  g.fillStyle='#222'; g.fillRect(bx,by2,bw,bh); g.strokeStyle='#777'; g.lineWidth=1; g.strokeRect(bx+.5,by2+.5,bw-1,bh-1);
  g.fillStyle=power.batt>.35?'#3ddc84':power.batt>.15?'#ffb020':'#ff3b30'; const lh=(bh-6)*power.batt; g.fillRect(bx+3,by2+bh-3-lh,bw-6,lh);
  // power rail along the gantry with moving charge dots
  g.strokeStyle=power.on?'rgba(255,200,40,.85)':'rgba(120,120,120,.6)'; g.lineWidth=1.5; g.beginPath(); g.moveTo(poolL-6,by+3); g.lineTo(poolR+6,by+3); g.stroke();
  if(power.on){ g.fillStyle='#fff3b0'; for(let i=0;i<10;i++){ const d=((now*.05+i*40)%(W*.5)); g.fillRect(cx+d,by+2,3,2); g.fillRect(cx-d,by+2,3,2); } }
}
function drawFood(){ g.fillStyle='#d9a45b'; for(const p of food){ g.beginPath(); g.arc(p.x,p.y,2.4,0,6.283); g.fill(); } /* SPRITE HOOK: SPRITES.food */ }

/* ---------- 8c. FEEDER + SENSORS (visible only WITH the prototype) -------------------
   ******************  SENSORS  ******************
   The 4 probes (DO, pH, turbidity, level) and their LEDs are the on-screen twins of the real sensors:
     GREEN blink = all fine | RED blink = about to go bad (or already bad, faster blink).
   sensorSnapshot() is what an SMS/WhatsApp pipeline can consume.      */
let grades=[0,0,0,0], sensState=makeSensorState(), ledPrev=[false,false,false,false], audioCtx=null, lastWorst=0, lastPush=0;
const GRADE_NAME=['OK','WARNING','CRITICAL'];
function sensorSnapshot(){ return { time:new Date().toISOString(), mode,
  readings:{ oxygen_mgL:+env.o2.toFixed(2), pH:+env.ph.toFixed(2), turbidity_NTU:+env.turb.toFixed(1), ammonia_mgL:+env.tan.toFixed(2), waterLevel_pct:+(env.level*100).toFixed(0) },
  status:Object.fromEntries(SENS.map((x,i)=>[x.k,GRADE_NAME[grades[i]]])), worst:GRADE_NAME[Math.max(...grades)],
  feed:{...feedStats} }; }
function onSensorUpdate(snap){ /* HOOK (every second): push snap to your farmer dashboard, e.g. WebSocket.send(JSON.stringify(snap)) */ }
async function sendAlert(snap){
  /* HOOK (only when the worst status CHANGES, e.g. OK -> WARNING): notify the farmer.
     Browsers must NOT hold WhatsApp/SMS secrets, so post to YOUR server and let it send the messages:
       fetch('https://YOUR-SERVER/api/pond-alert',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(snap)});
     Server side: forward to the farmer dashboard (WebSocket), WhatsApp (Meta WhatsApp Cloud API or Twilio),
     SMS (Twilio / Africa's Talking / any gateway).                                                      */
}
function beep(freq){ if(!$('snd').checked) return; try{ audioCtx=audioCtx||new AudioContext(); const o=audioCtx.createOscillator(),v=audioCtx.createGain();
  o.frequency.value=freq; v.gain.value=.04; o.connect(v); v.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+.08); }catch(e){} }
function drawSystem(light,now,sY){
  if(mode!=='proto') return;
  const by=landY-110, cx=W*.5, steel=rgb(mix([40,45,52],[150,158,168],light*.7+.3));
  g.fillStyle=steel; g.fillRect(poolL-6,by,poolR-poolL+12,6); g.fillRect(poolL-6,by,6,landY-by); g.fillRect(poolR,by,6,landY-by);   // gantry
  drawSolar(light,now,by);
  dispensing=Math.max(0,dispensing-.016);
  FEEDER.xs.forEach(fx=>{ const cx=W*fx;                         // one hopper per key feeding area
    const cg=g.createLinearGradient(cx-18,0,cx+18,0); cg.addColorStop(0,'#7d8892'); cg.addColorStop(.4,'#e4eaef'); cg.addColorStop(1,'#5f6a74');
    g.fillStyle=cg; g.fillRect(cx-18,by+6,36,38); g.beginPath(); g.ellipse(cx,by+6,18,5,0,0,6.283); g.fill();
    g.fillStyle='#5f6a74'; g.beginPath(); g.moveTo(cx-18,by+44); g.lineTo(cx-5,by+54); g.lineTo(cx+5,by+54); g.lineTo(cx+18,by+44); g.fill();
    g.fillStyle=!power.on?'#444':dispensing>0?'#ffb020':'#3ddc84'; g.beginPath(); g.arc(cx,by+25,4,0,6.283); g.fill(); });
  // sensor probes hanging into the water, each with a status LED
  [.1,.35,.65,.9].forEach((fx,i)=>{ const sx=W*fx, gr=grades[i], period=gr===0?1.6:gr===1?.6:.25, on=power.on&&((now/1000)%period)<(gr===0?.15:period/2);
    g.fillStyle=steel; g.fillRect(sx-1,by+6,2,Math.max(10,sY+28-by-6)); g.fillStyle='#d8c85a'; g.fillRect(sx-4,Math.max(by+16,sY+28),8,9);   // rod + probe head
    g.fillStyle='#222'; g.fillRect(sx-10,by-14,20,14);
    g.save(); g.fillStyle=on?(gr===0?'#3ddc84':'#ff3b30'):'#333'; if(on){ g.shadowColor=gr===0?'#3ddc84':'#ff3b30'; g.shadowBlur=14; }
    g.beginPath(); g.arc(sx,by-7,4,0,6.283); g.fill(); g.restore();
    g.fillStyle='#fff'; g.font='10px system-ui'; g.textAlign='center'; g.fillText(SENS[i].n,sx,by-18);
    if(on&&!ledPrev[i]) beep(gr===0?660:gr===1?880:1200); ledPrev[i]=on; });
}

/* ---------- 9. ANALYSIS (button): mortality with vs without the system ---------- */
function runAnalysis(){
  const days=14, runs=20, out={};
  for(const sys of [false,true]){ let acc=null, causes={};
    for(let i=0;i<runs;i++){ const r=runScenario(sys,100+i,days); acc=acc?acc.map((v,k)=>v+r.curve[k]):r.curve.slice(); for(const c in r.causes) causes[c]=(causes[c]||0)+r.causes[c]; }
    out[sys?'with':'without']={curve:acc.map(v=>v/runs*100),causes}; }
  const c=$('ch').getContext('2d'), w=340, h=190, L=34, B=24; c.clearRect(0,0,w,h);
  c.font='10px system-ui'; c.fillStyle='#9fb6bf'; c.strokeStyle='#355'; c.textAlign='right';
  for(let p=0;p<=100;p+=25){ const y=h-B-(h-B-8)*p/100; c.beginPath(); c.moveTo(L,y); c.lineTo(w-6,y); c.stroke(); c.fillText(p+'%',L-4,y+3); }
  c.textAlign='center'; for(let d=0;d<=days;d+=2) c.fillText('day '+d,L+(w-L-6)*d/days,h-8);
  [['without','#ff6b5a'],['with','#3ddc84']].forEach(([k,col])=>{ c.strokeStyle=col; c.lineWidth=2.5; c.beginPath();
    out[k].curve.forEach((v,i,a)=>{ const x=L+(w-L-6)*i/(a.length-1), y=h-B-(h-B-8)*v/100; i?c.lineTo(x,y):c.moveTo(x,y); }); c.stroke(); });
  const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k).slice(0,2).join(', ')||'none';
  const fw=out.without.curve.at(-1), fs=out.with.curve.at(-1);
  $('anaTxt').innerHTML=`<span style="color:#ff6b5a">Without system: ${fw.toFixed(0)}% mortality</span> (main causes: ${top(out.without.causes)})<br>`+
    `<span style="color:#3ddc84">With system: ${fs.toFixed(0)}% mortality</span> (main causes: ${top(out.with.causes)})<br>`+
    `<small>Average of ${runs} simulated ponds. Assumptions are in runScenario() and P{}.</small>`;
  $('ana').hidden=false;
}
$('bAna').onclick=runAnalysis; $('anaX').onclick=()=>{ $('ana').hidden=true; };

/* ---------- 10. UI + MAIN LOOP ------------------------------------ */
let mode='proto';                    // 'proto' = WITH prototype | 'natural' = WITHOUT
function setMode(m){ mode=m; $('mode').value=m; for(const k in S) S[k].disabled=(m!=='proto'); sensState=makeSensorState(); grades=[0,0,0,0]; }
$('mode').onchange=e=>setMode(e.target.value);
$('bFeed').onclick=()=>mode==='proto'?dispenseFeed():manualFeed();
function restock(){ fish.length=0; for(let i=0;i<CFG.N_FISH;i++) spawnFish(); stats.dead=0; stats.causes={}; food=[]; poop.length=0; wastedFeed=0; Object.assign(feedStats,{times:0,dispensedG:0,eatenG:0,wastedG:0});
  Object.assign(env,{level:.8,temp:26,o2:8,ph:7.2,tan:.3,turb:12,waste:0,aer:false,pump:false,exch:false}); }
$('bRestock').onclick=restock;
$('bExch').onclick=()=>{ env.tan*=.35; env.waste*=.35; poop.length=0; };   // stands in for the farmer's water exchange
window.PondAPI={ setPotentiometers, setMode, getSensors:sensorSnapshot, env, stats, feedStats };   // handy for your team

function protoEnv(dt){   // WITH prototype: the potentiometers decide, but less water => less oxygen
  const dH=dt*24/300, decay=P.wasteDecay*env.waste, vol=Math.max(env.level,.12);       // excreta + rotting feed keep acting in prototype mode
  env.waste=Math.max(0,env.waste-decay*dH); env.tan=Math.max(0,env.tan+(.4*decay/vol-P.nitrif*env.tan)*dH);
  /* the fish change the pond: breathing + digesting use oxygen (more fish / bigger fish / just after feeding = more), and busy bottom-feeders stir up mud */
  let bio=0,stir=0,nA=0; for(const f of fish){ if(f.state!=='swim'&&f.state!=='eat'&&f.state!=='gulp') continue; nA++; bio+=Math.pow(f.size/SC/20,2); if(f.y>bedY-35) stir+=Math.hypot(f.vx,f.vy)/90; }
  eatLoad=Math.max(0,eatLoad-dt*.04); const o2dem=clamp(.4*bio/Math.max(nA,10)+.3*eatLoad,0,.6), stirT=clamp(stir*.8,0,5);
  const liveNow=lastLive&&Date.now()-lastLive<10000;             // real sensor data is arriving from Velxio
  if(liveNow){                                                    // pond readings = the sensor readings, exactly
    const k=Math.min(1,dt*4);
    env.level=lerp(env.level,target.level,k); env.turb=lerp(env.turb,target.turb*100,k);
    env.ph=lerp(env.ph,target.ph*14,k);       env.o2=lerp(env.o2,target.o2*12,k);
  } else {
  env.level=lerp(env.level,target.level,dt*1.2);
  env.turb=lerp(env.turb,clamp(target.turb*100+12*env.waste+stirT,0,100),dt*1.2);       // more excreta => murkier
  env.ph=lerp(env.ph,clamp(target.ph*14-.15*env.tan,0,14),dt*1.2);                // more ammonia/CO2 => lower pH
  const lvF=.25+.75*Math.min(1,env.level/.5);                  // level <-> oxygen link
  env.o2=lerp(env.o2,Math.max(0,target.o2*12*lvF-o2dem),dt*1.2);
  }
  env.temp=25+(1-env.level)*3; env.aer=false;
}
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,.05); last=now;
  const t=timeOfDay(now), light=lightLevel(t), hour=(t*24+6)%24;
  const alive=fish.filter(f=>f.state!=='dead'&&f.state!=='dying').length;
  if(mode==='proto') protoEnv(dt); else stepEnv(env,dt,t,alive,Math.random);
  water.turb=env.turb/100; water.ph=env.ph/14; water.o2=env.o2/12; water.level=env.level;
  const sY=surfaceY(), col=waterColor(light);

  if(lastH>=0&&crossedHour(lastH,hour,FEEDER.times)) startFeedSession();
  updatePower(dt,light,now); updateFeeder(dt); updateGore(dt); updateCannibalism(dt);
  lastH=hour;
  if(mode==='proto'){ grades=updateSensors(sensState,env,dt*24/300);
    const worst=Math.max(...grades); if(worst!==lastWorst){ lastWorst=worst; sendAlert(sensorSnapshot()); }
    if(now-lastPush>1000){ lastPush=now; onSensorUpdate(sensorSnapshot()); } }

  updateBubbles(dt,sY); updateFood(dt,sY); updatePoop(dt,sY);
  lightNow=light; feedAlert=Math.max(0,feedAlert-dt);
  { const ts=mode==='proto'?FEEDER.times:CFG.manualTimes; if(Math.min(...ts.map(x=>((x-hour)+24)%24))<.6) feedAlert=Math.max(feedAlert,1); }   // fish anticipate feeding time
  for(const f of fish) updateFish(f,dt,sY);
  for(let i=fish.length-1;i>=0;i--) if(fish[i].state==='gone') fish.splice(i,1);

  g.clearRect(0,0,W,H);
  drawSky(t,light,now); drawLand(light);
  g.save(); g.beginPath(); g.rect(poolL,landY,poolR-poolL,H-landY); g.clip();      // pond opening (plants stay even when water is gone)
  drawWaterBack(light,now,sY,col); drawPlants(light,now); drawPoop();
  for(const f of fish.filter(f=>f.state!=='dead')) drawFish(f,light);
  drawGore();
  drawBubbles(); drawFood(); drawTurbidity(sY,col,now);
  g.fillStyle=`rgba(0,5,20,${(1-light)*.45})`; g.fillRect(poolL,sY,poolR-poolL,H);
  g.restore();
  for(const f of fish.filter(f=>f.state==='dead')) drawFish(f,light);   // dead fish stay on view
  drawSurface(light,now,sY,col);
  g.fillStyle=rgb(mix([14,10,10],[70,50,34],light)); g.fillRect(0,landY,poolL,H-landY); g.fillRect(poolR,landY,W-poolR,H-landY);
  drawSystem(light,now,sY);
  g.fillStyle=`rgba(5,10,40,${(1-light)*.25})`; g.fillRect(0,0,W,H);

  // HUD text
  const hh=Math.floor(hour), mm=Math.floor((hour-hh)*60);
  $('clock').textContent=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}  ${light<.08?'Night':t<.12?'Morning':t<.4?'Day':t<.5?'Evening':'Night'}`;
  if(mode!=='proto'){ S.T.value=env.turb; S.P.value=env.ph; S.O.value=env.o2; S.L.value=env.level*100; }
  $('vT').textContent=Math.round(env.turb)+' NTU'; $('vP').textContent=env.ph.toFixed(1);
  $('vO').textContent=env.o2.toFixed(1)+' mg/L now'; $('vL').textContent=Math.round(env.level*100)+'%';
  const n=fish.length, mort=n?stats.dead/n*100:0;
  $('status').innerHTML=`Alive ${alive}/${n} &middot; dead ${stats.dead} (${mort.toFixed(0)}% mortality)<br>Fed ${feedStats.times} times (${feedStats.dispensedG} g) &middot; wasted ${wastedFeed} g<br>Excreta in water ${env.waste.toFixed(1)} &middot; ammonia ${env.tan.toFixed(1)} mg/L<br>`+
    (mode==='proto'?`Sensors: ${GRADE_NAME[Math.max(...grades)]}. 3 auto-feeders. Click the pond to hand-feed.`:'No prototype: water changes naturally. Hand feeding at 08:00 and 17:00.');
  requestAnimationFrame(frame);
}
resize(); readSliders(); setMode('proto');
env.level=target.level; env.turb=target.turb*100; env.ph=target.ph*14; env.o2=target.o2*12;
requestAnimationFrame(frame);
</script>

<!-- ============ LIVE LINK: Velxio ESP32 --> Flask backend --(SSE)--> this page ============ -->
<div id="live" style="position:fixed;right:8px;bottom:8px;width:250px;max-width:calc(100% - 16px);background:rgba(10,25,35,.8);color:#e6f2f4;padding:7px 10px;border-radius:10px;font:11.5px system-ui;z-index:5">
  <div id="liveHd" style="cursor:pointer;display:flex;justify-content:space-between;gap:8px;white-space:nowrap"><b>Velxio ESP32: <span id="liveSt">connecting...</span></b><span id="liveSum" style="opacity:.85"></span><span><button id="bRefreshTop" title="Refresh" style="background:#1f4256;color:#fff;border:0;border-radius:5px;padding:0 6px;margin-right:4px;font-size:13px;cursor:pointer">&#8635;</button><span id="liveArrow">&#9662;</span></span></div>
  <div id="liveBody"><div id="liveVals" style="margin-top:6px;line-height:1.45"></div>
  <button id="bRefresh" style="display:block;width:100%;margin-top:6px;font-size:12px;padding:5px;border-radius:6px;border:0;background:#1f4256;color:#fff;cursor:pointer">&#8635; Refresh</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
/* ===== LIVE DATA FROM THE FLASK BACKEND (Server-Sent Events) =====
   The backend receives the ESP32's readings, grades them, saves history, sends the SMS alerts,
   and pushes every reading to this page. */
/* ---- SETTINGS (passed by the FishLink page in the address, e.g. pond-sim.html?population=1200&stream=https://...) ----
   stream     = address of the Flask backend's /stream (live sensors + SMS alerts). Leave empty to listen to the MQTT broker directly.
   topic      = MQTT topic (only used when there is no 'stream'); must match the ESP32 sketch.
   population = number of fish in the pond; the animation shows that many, up to what fits the screen. */
const QS=new URLSearchParams(location.search);
const STREAM_URL=QS.get('stream')||'';
const MQTT_URL='wss://broker.hivemq.com:8884/mqtt';
const MQTT_TOPIC=QS.get('topic')||'techsharks-fishpond-7731/readings';

let esp=null, rx=0, lastAlert=null;
{ const body=$('liveBody'), arrow=$('liveArrow'); const set=open=>{ body.style.display=open?'block':'none'; arrow.innerHTML=open?'&#9662;':'&#9652;'; };
  set(innerWidth>=700); $('liveHd').onclick=()=>set(body.style.display==='none'); }
$('bRefresh').onclick=()=>location.reload();
$('bRefreshTop').onclick=ev=>{ ev.stopPropagation(); location.reload(); };
function setSt(t,c){ $('liveSt').textContent=t; $('liveSt').style.color=c; }
if(mode!=='proto') setMode('proto');

function onReading(m){
  esp=m; lastLive=Date.now(); rx++;
  setPotentiometers(m.t,m.p,m.o,m.l);        // moves the simulation: turbidity, pH, oxygen, water level
  setSt('LIVE','#7dff9b');
}
function connectStream(){
  const es=new EventSource(STREAM_URL);       // the browser reconnects by itself if the connection drops
  es.onopen=()=>{ if(!lastLive) setSt('server OK - waiting for ESP32','#ffd37d'); };
  es.onmessage=ev=>{ try{ const m=JSON.parse(ev.data); if(['t','p','o','l'].every(k=>typeof m[k]==='number')) onReading(m); }catch(e){} };
  es.addEventListener('alert',ev=>{ try{ lastAlert=Object.assign(JSON.parse(ev.data),{at:Date.now()}); }catch(e){} });
  es.onerror=()=>setSt('reconnecting to server...','#ffd37d');
}
function connectMqtt(){
  if(typeof mqtt==='undefined'){ setSt('mqtt.js did not load','#ff7d7d'); return; }
  const cli=mqtt.connect(MQTT_URL,{clientId:'pondweb-'+Math.random().toString(16).slice(2,10),clean:true,keepalive:30,reconnectPeriod:2000,connectTimeout:10000});
  cli.on('connect',()=>{ cli.subscribe(MQTT_TOPIC); if(!lastLive) setSt('broker OK - waiting for ESP32','#ffd37d'); });
  cli.on('reconnect',()=>setSt('reconnecting to broker...','#ffd37d'));
  cli.on('error',()=>setSt('broker error','#ff7d7d'));
  cli.on('message',(t,buf)=>{ try{ const m=JSON.parse(buf.toString()); if(['t','p','o','l'].every(k=>typeof m[k]==='number')) onReading(m); }catch(e){} });
}
if(STREAM_URL) connectStream(); else connectMqtt();

setInterval(()=>{ if(lastLive&&Date.now()-lastLive>10000) setSt('ESP32 stopped sending','#ff9b7d'); },2000);

setInterval(()=>{ const e=PondAPI.env, col=['#7dff9b','#ffd37d','#ff7d7d'], nm=['OK','WARN','CRITICAL'];
  const row=(n,v,i)=>`<div style="color:${col[grades[i]]}">${n}: ${v} <small>${nm[grades[i]]}</small></div>`;
  const live=fish.filter(f=>f.state==='swim'||f.state==='eat'||f.state==='gulp');
    $('liveSum').innerHTML=lastLive?`${rx} msgs &middot; ${live.length} fish`:`${live.length} fish`;
  const raw=esp?'':`<div style="padding:3px 0 4px;border-bottom:1px solid #345;opacity:.8">No data from the ESP32 yet.<br>Run the circuit in Velxio.</div>`;
  $('liveVals').innerHTML=raw+row('Oxygen',e.o2.toFixed(1)+' mg/L',0)+row('pH',e.ph.toFixed(1),1)+row('Turbidity',Math.round(e.turb)+' NTU',2)+row('Level',Math.round(e.level*100)+'%',3)
   +((lastAlert&&Date.now()-lastAlert.at<180000)?`<div style="color:#ff9b7d;margin-top:4px">&#9888; ${lastAlert.text} <small>(SMS ${lastAlert.sms})</small></div>`:'')
   +`<div style="margin-top:5px;padding-top:4px;border-top:1px solid #345">&#9728; Solar ${Math.round(power.solar*100)}% &middot; &#128267; ${Math.round(power.batt*100)}%${power.on?'':' <b style="color:#ff7d7d">NO POWER</b>'}</div>`
   +`<div>Feeder: ${FEED.log} <small>(${feedStats.times} feeds)</small></div>`
   +`<div>Fish alive: ${live.length}/${spawned}</div>`+((stats.eaten||0)?`<div style="color:#ff9b7d">Eaten by other fish: ${stats.eaten}</div>`:''); },500);
</script>
</body>
